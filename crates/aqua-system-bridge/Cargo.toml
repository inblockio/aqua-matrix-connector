[package]
name = "aqua-system-bridge"
version.workspace = true
edition.workspace = true
description = "Host front end of the Aqua System bridge: the stdio MCP server `aqua-system-bridge-mcp` that Claude Code sessions use to message allow-listed people and rooms on Element through the `aqua-system-bridged` daemon (tools and policy from `aqua-messenger`, host profile), plus the host state-dir/socket defaults and the m.direct repair. Never opens a Matrix client or crypto store."
license.workspace = true
repository.workspace = true

[lib]
name = "aqua_system_bridge"
path = "src/lib.rs"

[[bin]]
name = "aqua-system-bridge-mcp"
path = "src/main.rs"

[dependencies]
aqua-messenger.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
